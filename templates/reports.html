{% extends "dashboard_shell.html" %}
{% block content %}
<div class="page-header"><h1>Reports Overview</h1></div>
<div class="stat-grid">
  {% for label, value, color in stats %}
  <div class="stat-card" style="--stat-color: {{ color }};">
    <div class="stat-value">{{ value }}</div>
    <div class="stat-label">{{ label }}</div>
  </div>
  {% endfor %}
</div>
<p class="muted">Overall attendance rate: {{ attendance_rate }}%  ({{ present_count }}/{{ total_count }} records)</p>
{% endblock %}
